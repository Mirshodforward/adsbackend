# /etc/nginx/sites-available/api.osontarget.uz
# HTTPS'ni certbot qo'shadi:  certbot --nginx -d api.osontarget.uz
# (shart: api.osontarget.uz DNS A yozuvi shu serverga ishora qilishi kerak).
#
# Backend faqat 127.0.0.1:4400 da tinglaydi — tashqariga faqat shu yerdan chiqadi.
server {
    listen 80;
    listen [::]:80;
    server_name api.osontarget.uz;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
