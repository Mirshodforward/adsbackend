# ─── PRODUCTION: api.osontarget.uz ───────────────────────────────────────────
# postgres + backend (NestJS) + caddy (HTTPS, Let's Encrypt).
# Postgres va backend porti tashqariga OCHILMAYDI — faqat Caddy (80/443).
#
# Birinchi marta va har yangilanishda:  ./deploy.sh
# Sirlar: .env (namuna — .env.production.example)
#
# Boshqa (managed) Postgres ishlatilsa: `postgres` servisini va backend'dagi
# DATABASE_URL override'ini olib tashlab, DATABASE_URL'ni .env'ga yozing.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env faylida sozlang}
      POSTGRES_USER: ${POSTGRES_USER:?.env faylida sozlang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida sozlang}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      # Image'da curl yo'q, node bor.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddydata:
  caddyconfig:
